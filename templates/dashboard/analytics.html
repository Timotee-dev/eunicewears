{% extends "dashboard/base.html" %}{% block title %}Analytics{% endblock %}{% block page %}analytics{% endblock %}
{% block content %}
<h1>Analytics</h1>
<form class="filters" data-range>
  <div class="actions" role="group" aria-label="Date range">
    <button class="btn btn--ghost btn--small" type="button" data-days="1">Today</button>
    <button class="btn btn--ghost btn--small" type="button" data-days="7">7 days</button>
    <button class="btn btn--ghost btn--small" type="button" data-days="30">30 days</button>
    <button class="btn btn--ghost btn--small" type="button" data-days="90">90 days</button>
    <button class="btn btn--ghost btn--small" type="button" data-days="year">This year</button>
  </div>
  <div class="field"><label for="from">From</label><input id="from" name="from" type="date"></div>
  <div class="field"><label for="to">To</label><input id="to" name="to" type="date"></div>
  <button class="btn btn--small" type="submit">Show</button>
</form>
<div class="tiles" data-tiles aria-busy="true"><div class="skeleton"></div></div>
<div class="dash__cols">
  <section class="dash__wide"><h2>Revenue per day</h2><div class="chart" data-chart="revenue"></div></section>
  <section class="dash__wide"><h2>Orders per day</h2><div class="chart" data-chart="orders"></div></section>
  <section><h2>Best sellers</h2><div data-top></div></section>
  <section><h2>Sales by category</h2><div data-categories></div></section>
  <section><h2>Best customers</h2><div data-customers></div></section>
  <section><h2>Promo codes used</h2><div data-promos></div></section>
</div>
{% endblock %}
