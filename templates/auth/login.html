{% extends "auth/_shell.html" %}
{% block title %}Sign in | Eunice Wears{% endblock %}
{% block heading %}Sign in{% endblock %}
{% block form %}
<form class="form" data-form="login" novalidate>
  <p class="form-error" role="alert" data-form-error hidden></p>
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <p class="field-error" data-error-for="email"></p></div>
  <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="field-error" data-error-for="password"></p></div>
  <button class="btn btn--block" type="submit" data-busy-label="Signing in">Sign in</button>
</form>
<form class="form" data-form="resend" data-resend hidden novalidate>
  <input type="hidden" name="email">
  <button class="btn btn--ghost btn--block" type="submit" data-busy-label="Sending">Send the confirmation link again</button>
</form>
<p class="auth__links"><a href="{% url 'forgot-password' %}">Forgot your password?</a><a href="{% url 'register' %}">Create account</a></p>
{% endblock %}
